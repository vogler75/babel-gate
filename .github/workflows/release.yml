name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: go test -v ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build and Package
        run: |
          set -euo pipefail

          BINARY_NAME="babelgate"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi

          OUTPUT_BIN="${BINARY_NAME}${EXT}"
          echo "Building ${OUTPUT_BIN} for ${{ matrix.goos }}/${{ matrix.goarch }}..."
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" -o "${OUTPUT_BIN}" ./cmd/router

          PKG_DIR="pkg_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "${PKG_DIR}" dist
          mv "${OUTPUT_BIN}" "${PKG_DIR}/"

          # Copy supplementary files if present
          for f in README.md LICENSE config.example.yaml; do
            if [ -f "$f" ]; then
              cp "$f" "${PKG_DIR}/"
            fi
          done

          TAG_NAME="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="${BINARY_NAME}-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd "${PKG_DIR}" && zip -r "../dist/${ARCHIVE_NAME}.zip" .)
          else
            tar -czvf "dist/${ARCHIVE_NAME}.tar.gz" -C "${PKG_DIR}" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
